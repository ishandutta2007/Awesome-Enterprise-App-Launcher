<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Orb Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes streamFlow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(129, 140, 248, 0.8)); }
    }
    .orb-animated-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .orb-animated-2 {
      animation: pulseOrb 10s ease-in-out 2s infinite alternate;
      transform-origin: center;
    }
    .card-float-1 {
      animation: floatCard1 6s ease-in-out infinite;
    }
    .card-float-2 {
      animation: floatCard2 7s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 12, 12;
      animation: streamFlow 4s linear infinite;
    }
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .hero-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGradient)" />
  <rect width="1200" height="420" rx="20" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Atmosphere Orbs (Background layer) -->
  <circle class="orb-animated-1" cx="220" cy="110" r="130" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-animated-2" cx="980" cy="310" r="160" fill="#818cf8" filter="url(#glow)" />
  <circle class="orb-animated-1" cx="600" cy="380" r="100" fill="#c084fc" filter="url(#glow)" />

  <!-- Dynamic Connecting Data Streams (Background layer) -->
  <path class="stream-line" d="M 50 360 C 300 360, 450 390, 800 340 S 1150 200, 1150 120" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.35" />
  <path class="stream-line" d="M 50 80 C 250 140, 500 50, 750 100 S 1050 50, 1150 70" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Background Floating UI Cards (Decorative side elements) -->
  <g class="card-float-1" opacity="0.45">
    <rect x="70" y="60" width="130" height="54" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="95" cy="87" r="12" fill="#38bdf8" />
    <rect x="118" y="79" width="60" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="118" y="91" width="40" height="5" rx="2.5" fill="#64748b" />
  </g>

  <g class="card-float-2" opacity="0.45">
    <rect x="990" y="80" width="140" height="58" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="1018" cy="109" r="12" fill="#818cf8" />
    <rect x="1040" y="101" width="68" height="7" rx="3.5" fill="#94a3b8" />
    <rect x="1040" y="113" width="46" height="5" rx="2.5" fill="#64748b" />
  </g>

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="-145" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text class="hero-sub" x="10" y="5.5" font-size="13" font-weight="600" fill="#93c5fd" letter-spacing="1.5">ENTERPRISE CLOUD &amp; OPEN SOURCE</text>
  </g>

  <!-- Foreground Content: Main Title -->
  <g transform="translate(600, 165)" text-anchor="middle">
    <text class="hero-title" x="0" y="0" font-size="52" fill="url(#primaryTextGrad)" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.8))">
      Awesome Enterprise App Launcher
    </text>
  </g>

  <!-- Foreground Content: Subtitle & Description -->
  <g transform="translate(600, 222)" text-anchor="middle">
    <text class="hero-sub" x="0" y="0" font-size="19" fill="#e2e8f0" font-weight="500" letter-spacing="0.2">
      Curated Catalog of SSO Portals, Digital Workspaces &amp; Self-Hosted Access Hubs
    </text>
    <text class="hero-sub" x="0" y="32" font-size="15" fill="#94a3b8">
      Zero-Trust Identity • Application Dashboards • VDI Streaming • RBAC &amp; OIDC Orchestration
    </text>
  </g>

  <!-- Foreground Content: Interactive Feature Tag Pills -->
  <g transform="translate(600, 320)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-17" width="130" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text class="hero-sub" x="0" y="5" font-size="13" fill="#cbd5e1" font-weight="500">🔐 SSO &amp; IdP</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-180, 0)">
      <rect x="-70" y="-17" width="140" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text class="hero-sub" x="0" y="5" font-size="13" fill="#cbd5e1" font-weight="500">🚀 App Launchers</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(0, 0)">
      <rect x="-75" y="-17" width="150" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text class="hero-sub" x="0" y="5" font-size="13" fill="#cbd5e1" font-weight="500">🛡️ Zero-Trust IAM</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(180, 0)">
      <rect x="-70" y="-17" width="140" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text class="hero-sub" x="0" y="5" font-size="13" fill="#cbd5e1" font-weight="500">🏠 Self-Hosted</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(360, 0)">
      <rect x="-65" y="-17" width="130" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text class="hero-sub" x="0" y="5" font-size="13" fill="#cbd5e1" font-weight="500">💻 Workspaces</text>
    </g>
  </g>
</svg>
